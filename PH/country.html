<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Your Country</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    max-width:550px;
    margin:auto;
    background:#fff;
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    background:#fff;
    padding:20px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    border-bottom:1px solid #eee;
    z-index:100;
}

.search{
    padding:15px;
}

.search input{
    width:100%;
    padding:14px;
    border-radius:30px;
    border:1px solid #ddd;
    outline:none;
    font-size:16px;
}

.country{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px;
    margin:12px 15px;
    background:white;
    border-radius:18px;
    border:1px solid #eee;
    cursor:pointer;
    transition:.2s;
}

.country:hover{
    background:#f7f7f7;
    transform:scale(1.02);
}

.flag{
    font-size:36px;
}

.name{
    font-size:22px;
    font-weight:bold;
    color:#333;
}

.footer{
    padding:30px;
    text-align:center;
    color:#888;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
Choose Your Country
</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Search country...">

</div>

<div id="list">

<div class="country" data-country="PH">
<div class="flag">🇵🇭</div>
<div class="name">Philippines</div>
</div>

<div class="country" data-country="ITA">
<div class="flag">🇮🇹</div>
<div class="name">Italy</div>
</div>

<div class="country" data-country="QA">
<div class="flag">🇶🇦</div>
<div class="name">Qatar</div>
</div>

<div class="country" data-country="SGP">
<div class="flag">🇸🇬</div>
<div class="name">Singapore</div>
</div>

<div class="country" data-country="TWN">
<div class="flag">🇹🇼</div>
<div class="name">Taiwan</div>
</div>

<div class="country" data-country="UA">
<div class="flag">🇦🇪</div>
<div class="name">United Arab Emirates</div>
</div>

<div class="country" data-country="CA">
<div class="flag">🇨🇦</div>
<div class="name">Canada</div>
</div>

<div class="country" data-country="JPN">
<div class="flag">🇯🇵</div>
<div class="name">Japan</div>
</div>

<div class="country" data-country="UK">
<div class="flag">🇬🇧</div>
<div class="name">United Kingdom</div>
</div>

<div class="country" data-country="HRV">
<div class="flag">🇭🇷</div>
<div class="name">Croatia</div>
</div>
    
<div class="country" data-country="SA">
<div class="flag">🇸🇦</div>
<div class="name">Saudi Arabia</div>
</div>

<div class="country" data-country="KR">
<div class="flag">🇰🇷</div>
<div class="name">South Korea</div>
</div>
    
</div>

<div class="footer">

Please select your country.

</div>

</div>
    
<script src="products.js"></script>
    
<script>

// Kunin ang product mula sa URL
const params = new URLSearchParams(location.search);
const product = params.get("product");

// Country selection
document.querySelectorAll(".country").forEach(card => {

    card.onclick = () => {

        // Walang product o hindi kilalang product
        if (!product || !products[product]) {
            window.location.href = "not-available.html";
            return;
        }

        const country = card.dataset.country;
        const link = products[product][country];

        // Walang link para sa napiling country
        if (!link) {
            window.location.href =
                "not-available.html?product=" +
                product +
                "&country=" +
                country;
            return;
        }

        // Redirect sa tamang product link
        window.location.href = link+11111510551;

    };

});

// Search
const search = document.getElementById("search");

search.addEventListener("input", () => {

    const keyword = search.value.toLowerCase();

    document.querySelectorAll(".country").forEach(card => {

        const text = card.innerText.toLowerCase();

        card.style.display = text.includes(keyword)
            ? "flex"
            : "none";

    });

});

</script>

</body>
</html>
