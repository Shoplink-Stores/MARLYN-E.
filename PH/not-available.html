<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Not Available</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:#fff;
    max-width:500px;
    width:100%;
    text-align:center;
    padding:30px 20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.container img{
    width:100%;
    max-width:380px;
    height:auto;
    margin-bottom:25px;
}

.continue-btn{
    display:inline-block;
    background:#0d6efd;
    color:#fff;
    text-decoration:none;
    padding:14px 30px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.continue-btn:hover{
    background:#0b5ed7;
}
</style>

</head>
<body>

<div class="container">

    <img src="not-available.png" alt="Item not available">

    <a href="shop.html" class="continue-btn">
        Continue Shopping
    </a>

</div>

</body>
</html>
